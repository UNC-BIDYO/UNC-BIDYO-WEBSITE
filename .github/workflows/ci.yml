name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run on the same branch/PR when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Type-check, format, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Images and video are stored in Git LFS (.gitattributes). Without lfs: true the
      # runner gets pointer files, and vite-imagetools fails to decode them.
      - uses: actions/checkout@v7
        with:
          lfs: true

      # Versions match .mise.toml.
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.3

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      # API, email, Google Calendar, admin and overlap-check tests (tests/), external services stubbed.
      - name: Test
        run: pnpm test:coverage

      # Only src/ is checked: the root config files are generated and managed by Figma Make.
      - name: Check formatting
        run: pnpm exec oxfmt --check src

      - name: Build
        run: pnpm build
