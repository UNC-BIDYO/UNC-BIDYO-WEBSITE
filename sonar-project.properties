# SonarCloud analysis (https://sonarcloud.io). The CI step runs only once the SONAR_TOKEN
# repository secret exists; see README.md → "SonarCloud".
sonar.projectKey=UNC-BIDYO_UNC-BIDYO-WEBSITE
sonar.organization=unc-bidyo
sonar.projectName=UNC Bidyo website

sonar.sources=src,api,scripts
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Vendored shadcn/ui primitives are third-party code; generated output isn't source.
sonar.exclusions=src/shared/ui/primitives/**,**/*.d.ts,dist/**,coverage/**
sonar.cpd.exclusions=src/shared/ui/primitives/**,tests/**

# Coverage from `pnpm test:coverage` (Vitest, v8 → lcov).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
